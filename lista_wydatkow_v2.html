<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista wydatków</title>

    <script src="script_v2.js" defer></script>
</head>

<body>

    <h1>Lista wydatków</h1>

    <form>
        <label for="nazwa">Nazwa wydatku:</label>
        <input type="text" id="nazwa">

        <label for="kwota">Kwota:</label>
        <input type="number" id="kwota" step="0.01">

        <label for="kategoria">Kategoria:</label>
        <select id="kategoria">
            <option value="jedzenie">Jedzenie</option>
            <option value="transport">Transport</option>
            <option value="rozrywka">Rozrywka</option>
            <option value="zakupy">Zakupy</option>
            <option value="rachunki">Rachunki</option>
            <option value="inne">Inne</option>
        </select>

        <label for="data">Data wydatku:</label>
        <input type="date" id="data">

        <button type="submit">Dodaj</button>
    </form>


    <h2>Podsumowanie</h2>

    <p>
        Łączna kwota:
        <strong><span id="suma">0.00</span> zł</strong>
    </p>

    <p>
        Liczba wydatków:
        <strong><span id="liczbaWydatkow">0</span></strong>
    </p>

    <h2>Wydatki</h2>
    <input type="text" id="wyszukiwarka" placeholder="Szukaj wydatku...">

    <label for="filtrKategoria">Kategoria:</label>
    <select id="filtrKategoria">
        <option value="wszystkie">Wszystkie</option>
        <option value="jedzenie">Jedzenie</option>
        <option value="transport">Transport</option>
        <option value="rozrywka">Rozrywka</option>
        <option value="zakupy">Zakupy</option>
        <option value="rachunki">Rachunki</option>
        <option value="inne">Inne</option>
    </select>

    <label for="filtrMiesiac">Miesiąc:</label>
    <input type="month" id="filtrMiesiac">


    <label for="sortowanie">Sortowanie:</label>
    <select id="sortowanie">
        <option value="najnowsze">Najnowsze</option>
        <option value="najstarsze">Najstarsze</option>
        <option value="najdrozsze">Najdroższe</option>
        <option value="najtansze">Najtańsze</option>
    </select>


    <ul id="lista"></ul>


    <h2>Wydatki według kategorii</h2>

    <ul id="podsumowanieKategorii"></ul>


    <button type="button" id="usunWszystkie">
        Usuń wszystkie wydatki
    </button>

</body>
</html>
